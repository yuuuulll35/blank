<html lang="ko">

<style>

:root{
  --bg:#FAFAF6; --panel:#FFFFFF; --ink:#1B1E23; --muted:#6E7078; --line:#E3E3D9; --accent:#1B1E23; --warn:#B3423A;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17181B; --panel:#1F2125; --ink:#ECEDEF; --muted:#9AA0A6; --line:#33363C; --accent:#ECEDEF; --warn:#E07A70; }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
main{max-width:560px; margin:0 auto; padding:28px 16px 48px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px}
h1{margin:0; font-size:18px; font-weight:800}
a{color:var(--muted)}
a:hover{color:var(--ink)}
.box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px}
.box h2{margin:0 0 10px; font-size:13px; font-weight:800; color:var(--muted)}
.meta{font-size:12.5px; color:var(--muted)}
.title{font-size:16px; font-weight:700; margin:2px 0 6px}
.preview{margin:10px 0 0; padding:10px 12px; border-left:2px solid var(--line); color:var(--muted); font-size:13px; white-space:pre-wrap; max-height:9.6em; overflow:hidden}
label{display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:650; margin-bottom:10px}
input{font:inherit; color:var(--ink); padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel)}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{
  font:inherit; border:1px solid var(--line); background:var(--panel); border-radius:8px; cursor:pointer;
  padding:8px 14px; font-weight:650; color:var(--ink); font-size:13px;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:700}
.btn:disabled{opacity:.4; cursor:default}
#status{font-size:13px; margin-top:10px; min-height:1.6em}
#status.err{color:var(--warn)}
.empty{color:var(--muted)}

#oocPick{display:grid; grid-template-columns:1fr 10rem; gap:8px; margin:0 0 4px}
#oocPick[hidden], #logOpts[hidden]{display:none}
select{font:inherit; color:var(--ink); padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel)}
#dests, #tags, #cats{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px}
#tags:empty{display:none}
.tag{display:inline-flex; flex-direction:row; align-items:center; gap:6px; margin:0; padding:5px 11px; border:1px solid var(--line); border-radius:999px; font-size:12.5px; font-weight:650; cursor:pointer; user-select:none}
.tag input{position:absolute; opacity:0; pointer-events:none}
.tag i{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 0 1px rgba(127,127,127,.4)}
.tag:has(input:checked){border-color:var(--ink); background:var(--ink); color:var(--bg)}
.tag:has(input:focus-visible){outline:2px solid var(--ink); outline-offset:2px}
#tagNote{font-size:12px; color:var(--muted); margin:-8px 0 12px}
#tagNote:empty{display:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>블로그로 올리기</h1>
    <a href="./">BLANK로 돌아가기</a>
  </header>

  <section class="box">
    <h2>보낼 글 (BLANK에서 지금 고른 문단)</h2>
    <div id="current"></div>
  </section>

  <section class="box">
    <h2>올릴 곳</h2>
    <div id="dests">
      <label class="tag"><input type="radio" name="dest" value="log" checked>새 로그</label>
      <label class="tag"><input type="radio" name="dest" value="ooc">OOC 카드 하위 글</label>
    </div>
    <div id="oocPick" hidden>
      <label>OOC 카드<select id="oocSel"></select></label>
      <label>날짜<input type="date" id="oocDate"></label>
    </div>
    <div id="logOpts">
    <h2>분류</h2>
    <div id="cats">
      <label class="tag"><input type="radio" name="cat" value="story" checked>서사</label>
      <label class="tag"><input type="radio" name="cat" value="ooc">OOC</label>
    </div>
    <h2>페어 <span style="font-weight:500">여러 개 골라도 돼요</span></h2>
    <div id="tags"></div>
    </div>
    <p id="tagNote"></p>
    <div class="row">
      <button class="btn primary" id="send" disabled>블로그로 올리기</button>
      <a id="openLog" href="#" target="_blank" rel="noopener" hidden>올린 글 보기</a>
    </div>
    <div id="status"></div>
  </section>

  <section class="box">
    <h2>블로그 연결</h2>
    <label>블로그 주소<input id="url" placeholder="https://smallroom.site" autocomplete="off"></label>
    <label>열쇠 (Cloudflare에 적어 둔 LOG_KEY)<input id="key" type="password" autocomplete="off"></label>
    <div class="row">
      <button class="btn" id="saveCfg">저장</button>
      <button class="btn" id="clearCfg">연결 해제</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch (e) { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const MODE = { book: '소설형', chat: '채팅형' };

const BLOG_URL = 'https://smallroom.site';

const ids = () => read('blank.blog.ids', {});
function status(msg, err) { $('status').textContent = msg; $('status').classList.toggle('err', !!err); }

function show() {
  const last = read('blank.last', null);
  const box = $('current');
  box.replaceChildren();
  const log = last && last.log;
  if (!log || !log.msgs || !log.msgs.length) {
    const p = document.createElement('p');
    p.className = 'empty';
    p.textContent = 'BLANK에서 [블로그로] 버튼을 누르면 여기에 나타나요. (같은 브라우저에서 열어야 해요)';
    box.append(p);
    $('send').disabled = true;
    $('openLog').hidden = true;
    return;
  }
  const t = document.createElement('div'); t.className = 'title'; t.textContent = log.title || '(제목 없음)';
  const m = document.createElement('div'); m.className = 'meta';
  m.textContent = `${MODE[log.mode] || log.mode} · ${log.msgs.length}문단 · ${new Date(last.at).toLocaleString('ko-KR')} 기준`;
  const pv = document.createElement('div'); pv.className = 'preview';
  pv.textContent = log.msgs.slice(0, 4).map(x => x.pic ? '[이미지]' : x.text.replace(/==|\*\*|__/g, '')).join('\n');
  box.append(t, m, pv);
  const cfg = read('blank.blog', null);
  const child = childs()[last.talk];
  if (child && !destTouched) setDest('ooc');
  $('send').disabled = false;
  syncDest();
  const toCard = dest() === 'ooc';
  const id = toCard ? (child && child.card === $('oocSel').value ? child.card : '') : ids()[last.talk];
  $('openLog').hidden = !(id && cfg);
  if (id && cfg) $('openLog').href = `${cfg.url}/blog/log/?id=${encodeURIComponent(id)}`;
  loadTags();
}

const childs = () => read('blank.blog.childs', {});
let destTouched = false;
function dest() { return (document.querySelector('input[name="dest"]:checked') || {}).value === 'ooc' ? 'ooc' : 'log'; }
function setDest(v) { const el = document.querySelector(`input[name="dest"][value="${v}"]`); if (el) el.checked = true; }
function syncDest() {
  const toCard = dest() === 'ooc';
  $('oocPick').hidden = !toCard; $('logOpts').hidden = toCard;
  const last = read('blank.last', null);
  if (!last) return;
  if (!$('oocDate').value) $('oocDate').value = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const child = childs()[last.talk];
  $('send').textContent = toCard
    ? (child && child.card === $('oocSel').value ? '같은 하위 글 고치기' : 'OOC 카드에 넣기')
    : (ids()[last.talk] ? '같은 글 고치기' : '블로그로 올리기');
}
document.querySelectorAll('input[name="dest"]').forEach(r => r.addEventListener('change', () => { destTouched = true; show(); }));
$('oocSel').addEventListener('change', show);
function fillOocs(list) {
  const last = read('blank.last', null);
  const child = last && childs()[last.talk];
  const keep = $('oocSel').value || (child && child.card) || '';
  $('oocSel').replaceChildren(...(list.length
    ? list.map(o => new Option(`${o.title} (글 ${o.n})`, o.id))
    : [Object.assign(new Option('OOC 카드가 없어요 — 블로그 LOG에서 [+ OOC 카드]로 먼저 만들어 주세요', ''), { disabled: true })]));
  if (keep && list.some(o => o.id === keep)) $('oocSel').value = keep;
  syncDest();
}

function loadCfg() {
  const cfg = read('blank.blog', {}) || {};
  $('url').value = cfg.url || BLOG_URL;
  $('key').value = cfg.key || '';
}
$('saveCfg').addEventListener('click', () => {
  const url = $('url').value.trim().replace(/\/+$/, ''), key = $('key').value.trim();
  if (!url || !key) { status('주소와 열쇠를 둘 다 적어 주세요', true); return; }
  write('blank.blog', { url, key });
  tagsFor = null;
  status('블로그 연결을 저장했어요');
  show();
});
$('clearCfg').addEventListener('click', () => {
  try { localStorage.removeItem('blank.blog'); } catch (e) {}
  tagsFor = null; tagsReady = false; $('tags').replaceChildren(); $('tagNote').textContent = '';
  loadCfg(); status('블로그 연결을 해제했어요'); show();
});

function readPic(id) {
  return new Promise((res, rej) => {
    const q = indexedDB.open('blank');
    q.onerror = () => rej(q.error);
    q.onsuccess = () => {
      const db = q.result;
      if (!db.objectStoreNames.contains('pics')) { db.close(); res(null); return; }
      const g = db.transaction('pics').objectStore('pics').get(id);
      g.onsuccess = () => { db.close(); res(g.result || null); };
      g.onerror = () => { db.close(); rej(g.error); };
    };
  });
}

async function dataImagesToFiles(cfg, html) {
  const urls = [...new Set(html.match(/data:image\/(?:webp|png|jpeg|gif);base64,[A-Za-z0-9+/=]+/g) || [])];
  const sent = read('blank.blog.pics', {});
  for (let i = 0; i < urls.length; i++) {
    const blob = await (await fetch(urls[i])).blob();
    const ext = { 'image/webp': 'webp', 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif' }[blob.type];
    const hex = [...new Uint8Array(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer()))].map(b => b.toString(16).padStart(2, '0')).join('');
    const name = hex + '.' + ext, mark = cfg.url + '/' + name;
    if (!sent[mark]) {
      status(`프로필 사진 올리는 중… (${i + 1}/${urls.length})`);
      const r = await fetch(`${cfg.url}/api/logs/img/${name}`, {
        method: 'PUT', headers: { 'content-type': blob.type, authorization: 'Bearer ' + cfg.key }, body: blob,
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(r.status === 401 ? '열쇠가 맞지 않아요. 아래 "블로그 연결"에서 다시 적어 주세요' : (d.error || `프로필 사진을 올리지 못했어요 (${r.status})`));
      sent[mark] = d.src;
      write('blank.blog.pics', sent);
    }
    html = html.split(urls[i]).join(sent[mark]);
  }
  return html;
}
async function withImages(cfg, log) {
  const ids = [...new Set([...log.msgs.map(m => m.pic && m.pic.id), log.style && log.style.bgPic].filter(Boolean))];
  const sent = read('blank.blog.pics', {});
  const srcs = {};
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i], mark = cfg.url + '/' + id;
    if (!sent[mark]) {
      status(`이미지 올리는 중… (${i + 1}/${ids.length})`);
      const blob = await readPic(id);
      if (!blob) throw new Error('이미지를 찾지 못했어요. BLANK에서 다시 넣어 주세요');
      const r = await fetch(`${cfg.url}/api/logs/img/${id}`, {
        method: 'PUT',
        headers: { 'content-type': blob.type, authorization: 'Bearer ' + cfg.key },
        body: blob,
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(r.status === 401 ? '열쇠가 맞지 않아요. 아래 "블로그 연결"에서 다시 적어 주세요' : (d.error || `이미지를 올리지 못했어요 (${r.status})`));
      sent[mark] = d.src;
      write('blank.blog.pics', sent);
    }
    srcs[id] = sent[mark];
  }
  const { bgPic, ...style } = log.style || {};
  if (bgPic) style.bgImage = srcs[bgPic];

  if (log.html) {
    let html = await dataImagesToFiles(cfg, log.html.replace(/blank-data:(\d+)/g, (all, k) => (log.dataUrls || [])[k] || all));
    html = html.replace(/blank-pic:([0-9a-f]{64}\.(?:webp|jpg|png|gif))/g, (all, id) => srcs[id] || all);
    if (bgPic && srcs[bgPic]) html = html.replace(/^<div style="/, `<div style="background-image:url(${srcs[bgPic]});background-size:cover;background-position:center;`);
    return { format: 'html', title: log.title || '', mode: log.mode === 'chat' ? 'chat' : 'book', html };
  }
  const msgs = log.msgs.map(({ pic, ...m }) => (pic ? { ...m, image: { src: srcs[pic.id], w: pic.w, h: pic.h } } : m));
  return { ...log, style, msgs };
}

let tagsReady = false, tagsFor = null;
const tagPicks = () => read('blank.blog.tags', {});
function pickedCat() { return (document.querySelector('input[name="cat"]:checked') || {}).value === 'ooc' ? 'ooc' : 'story'; }
function setCat(c) { const el = document.querySelector(`input[name="cat"][value="${c === 'ooc' ? 'ooc' : 'story'}"]`); if (el) el.checked = true; }
let catTouched = false;
document.querySelectorAll('input[name="cat"]').forEach(r => r.addEventListener('change', () => {
  catTouched = true;
  const last = read('blank.last', null); if (!last) return;
  const m = read('blank.blog.cats', {}); m[last.talk] = pickedCat(); write('blank.blog.cats', m);
}));
function pickedTags() { return [...document.querySelectorAll('#tags input:checked')].map(i => i.value); }
async function loadTags() {
  const cfg = read('blank.blog', null), last = read('blank.last', null);
  const talk = last && last.talk, id = talk ? ids()[talk] || '' : '';
  const key = (cfg && cfg.url) + '|' + talk + '|' + id;
  if (!cfg || !talk || tagsFor === key) return;
  tagsFor = key; tagsReady = false;
  $('tags').replaceChildren(); $('tagNote').textContent = '페어 목록 불러오는 중…';
  try {
    const r = await fetch(`${cfg.url}/api/logs/tags${id ? '?id=' + encodeURIComponent(id) : ''}`, { headers: { authorization: 'Bearer ' + cfg.key } });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 401 ? '열쇠가 맞지 않아 페어 목록을 못 불러왔어요' : (d.error || `페어 목록을 못 불러왔어요 (${r.status})`));

    const myCat = read('blank.blog.cats', {})[talk];
    setCat(myCat || d.cat || 'story');
    const mine = tagPicks()[talk];
    const on = new Set(Array.isArray(mine) ? mine : d.selected || []);
    for (const t of d.tags || []) {
      const lab = document.createElement('label'); lab.className = 'tag';
      const cb = Object.assign(document.createElement('input'), { type: 'checkbox', value: t.id, checked: on.has(t.id) });
      cb.addEventListener('change', () => { const p = tagPicks(); p[talk] = pickedTags(); write('blank.blog.tags', p); });
      const dot = document.createElement('i'); dot.style.setProperty('--c', t.color || '#999');
      lab.append(cb, dot, document.createTextNode(t.name));
      $('tags').append(lab);
    }
    tagsReady = true;
    fillOocs(d.oocs || []);
    $('tagNote').textContent = (d.tags || []).length ? '' : '블로그에 등록된 페어가 없어요';
  } catch (e) {
    tagsFor = null;
    $('tagNote').textContent = (e instanceof TypeError ? '블로그에 닿지 못해 페어 목록을 못 불러왔어요' : e.message) + ' — 올리면 기존 태그는 그대로 둬요';
  }
}
let busy = false;
$('send').addEventListener('click', async () => {

  if (!read('blank.blog', null) && $('url').value.trim() && $('key').value.trim()) $('saveCfg').click();
  const cfg = read('blank.blog', null);
  if (!cfg) { status('아래 "블로그 연결"에 열쇠(LOG_KEY)를 먼저 적어 주세요', true); $('key').focus(); return; }
  const last = read('blank.last', null);
  if (!last || !last.log || !last.log.msgs.length || busy) return;
  busy = true;
  const btn = $('send'), label = btn.textContent;
  btn.disabled = true; btn.textContent = '보내는 중…';
  const map = ids();
  let id = map[last.talk] || '';
  let payload;
  const send = (method, path) => fetch(cfg.url + path, {
    method,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key },
    body: JSON.stringify(payload),
  });
  try {
    if (dest() === 'ooc') {
      const card = $('oocSel').value;
      if (!card) { status('넣을 OOC 카드를 골라 주세요', true); return; }
      const cm = childs(), prev = cm[last.talk];
      const full = await withImages(cfg, last.log);
      payload = { pid: prev && prev.card === card ? prev.pid : undefined, date: $('oocDate').value, title: full.title || '', html: full.html || '', mode: full.mode };
      if (!payload.html) { status('이 대화는 하위 글로 보낼 수 없어요 (BLANK를 새로고침한 뒤 다시 [블로그로]를 눌러 주세요)', true); return; }
      const r = await send('POST', `/api/logs/${encodeURIComponent(card)}/posts`);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { status(r.status === 401 ? '열쇠가 맞지 않아요. 아래 "블로그 연결"에서 다시 적어 주세요' : (d.error || `보내지 못했어요 (${r.status})`), true); return; }
      cm[last.talk] = { card, pid: d.pid }; write('blank.blog.childs', cm);
      tagsFor = null;
      status(d.replaced ? 'OOC 카드의 같은 하위 글을 고친 내용으로 바꿨어요' : 'OOC 카드에 하위 글로 넣었어요. 고친 뒤 다시 누르면 같은 하위 글이 바뀌어요');
      return;
    }
    payload = await withImages(cfg, last.log);

    if (tagsReady) payload.tags = pickedTags();

    if (tagsReady || catTouched) payload.cat = pickedCat();
    let r = id ? await send('PUT', '/api/logs/' + id) : await send('POST', '/api/logs');

    if (r.status === 404 && id) { id = ''; r = await send('POST', '/api/logs'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      status(r.status === 401 ? '열쇠가 맞지 않아요. 아래 "블로그 연결"에서 다시 적어 주세요' : (d.error || `보내지 못했어요 (${r.status})`), true);
      return;
    }
    const updated = !!id;
    map[last.talk] = d.id; write('blank.blog.ids', map);
    status(updated ? '블로그 글을 고친 내용으로 바꿨어요' : '블로그에 올렸어요. BLANK에서 고친 뒤 다시 누르면 같은 글이 바뀌어요');
  } catch (e) {
    status(e instanceof TypeError ? '블로그에 닿지 못했어요. 주소를 확인해 주세요' : e.message, true);
  } finally {
    busy = false; btn.textContent = label; show();
  }
});

window.addEventListener('storage', e => { if (e.key === 'blank.last' || e.key === 'blank.blog') show(); });
